{% extends 'generic/object_children.html' %}
{% load helpers %}
{% load i18n %}

{% block extra_controls %}
  {% if perms.netbox_acls.add_aclassignment %}
    <a href="{% url add_url %}?assigned_object_object_id={{ object.pk }}&assigned_object_content_type={{ content_type_id }}&return_url={{ object.get_absolute_url }}" class="btn btn-primary">
      <i class="mdi mdi-plus-thick" aria-hidden="true"></i> {% trans "Assign an ACL" %}
    </a>
  {% endif %}
{% endblock extra_controls %}
