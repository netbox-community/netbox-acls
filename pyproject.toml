# See PEP 518 for the spec of this file
# https://www.python.org/dev/peps/pep-0518/

[build-system]
requires = ["setuptools >= 82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-acls"
version = "2.1.0"
requires-python = ">=3.12.0"
description = "NetBox plugin for managing Access Control Lists (ACLs)."
readme = { file = "README.md", content-type = "text/markdown" }
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
keywords = [
    "netbox",
    "netbox-plugin",
    "access-lists",
    "network-automation",
    "source-of-truth",
]
classifiers=[
    "Development Status :: 5 - Production/Stable",
    "Framework :: Django",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet",
    "Topic :: System :: Networking",
]

[project.optional-dependencies]
test = [
    "check-manifest==0.51",
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "ruff==0.16.5",
    "yamllint==1.38.0",
]

[project.urls]
Homepage = "https://github.com/netbox-community/netbox-acls/"
Documentation = "https://github.com/netbox-community/netbox-acls/blob/main/README.md"
Source = "https://github.com/netbox-community/netbox-acls/"
Issues = "https://github.com/netbox-community/netbox-acls/issues"
Changelog = "https://github.com/netbox-community/netbox-acls/releases"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["netbox_acls*"]
exclude = ["netbox_acls.tests*"]
namespaces = false

[tool.setuptools.package-data]
netbox_acls = [
    "templates/**",
    "static/**",
    "locale/**/*.mo",
]
