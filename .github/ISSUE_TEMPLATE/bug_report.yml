---
name: 🐛 Bug Report
description: Report a reproducible bug in the current release of NetBox ACLs
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >
        **NOTE:** This form is only for reporting _reproducible bugs_ in a
        current NetBox plugin installation.

        - Check the release notes:
          https://github.com/netbox-community/netbox-acls/releases
        - Look through the issues already resolved:
          https://github.com/netbox-community/netbox-acls/issues?q=is%3Aclosed
        - Join the `#netbox` channel on our Slack:
          https://join.slack.com/t/netdev-community/shared_invite/zt-mtts8g0n-Sm6Wutn62q_M4OdsaIycrQ

  - type: input
    attributes:
      label: NetBox ACLs Plugin version
      description: What version of NetBox ACLs are you currently running?
      placeholder: v2.1.0
    validations:
      required: true
  - type: input
    attributes:
      label: NetBox version
      description: What version of NetBox are you currently running?
      placeholder: v4.7.0
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Python version
      description: What version of Python are you currently running?
      options:
        - "3.12"
        - "3.13"
        - "3.14"
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to Reproduce
      description: >
        Please provide a minimal working example to demonstrate the bug. Begin
        with the initialization of any necessary database objects and clearly
        enumerate each operation carried out. Ensure that your example is as
        concise as possible while adequately illustrating the issue.

        _Please refrain from including any confidential or sensitive
        information in your example._
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: >
        The script should execute without raising any errors or exceptions
    validations:
      required: true
  - type: textarea
    attributes:
      label: Observed Behavior
      description: What happened instead?
      placeholder: A TypeError exception was raised
    validations:
      required: true
...
